# Application Name
spring.application.name=mvc

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mvc_mobapp}
# Use an environment variable, or the local database URL as a fallback.

spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
# Read the database username from the environment.

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# Read the database password from the environment.
spring.datasource.driver-class-name=org.postgresql.Driver


# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Enable H2 Console for Testing (Optional, Can Be Removed Later)
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

# Logging Configuration
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Security Configuration (For Development Only - Update for Production)
spring.security.user.name=admin
spring.security.user.password=admin

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:5000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

# JWT Configuration
jwt.secret=5ff409146e5be83f9cc09cf79117edc3024e1fc862638b50b175b681a3f6b81a
jwt.expiration=86400000
