name: Registration CI
# Name displayed in GitHub's Actions tab.

on:
  push:
    branches: [master]
    # Run when code is pushed to master.
  pull_request:
    branches: [master]
    # Also run for pull requests targeting master.
  workflow_dispatch:
    # Allow a manual run from GitHub.

permissions:
  contents: read
  # Allow this workflow to read the repository.

jobs:
  build:
    runs-on: ubuntu-latest
    # Use a temporary Linux machine supplied by GitHub.

    services:
      postgres:
        image: postgres:16
        # Start a temporary PostgreSQL database for tests.

        env:
          POSTGRES_DB: mvc_mobapp
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_test_password
          # These credentials belong only to the temporary CI database.
          # Do not replace them with your real database credentials.

        ports:
          - 5432:5432
          # Make PostgreSQL accessible from the runner.

        options: >-
          --health-cmd "pg_isready -U ci_user -d mvc_mobapp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        # Wait for PostgreSQL to become ready before running steps.

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/mvc_mobapp
      SPRING_DATASOURCE_USERNAME: ci_user
      SPRING_DATASOURCE_PASSWORD: ci_test_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      # Connect Spring tests to the temporary database.
      # Create its tables for the test application context.

    steps:
      - name: Download repository
        uses: actions/checkout@v6
        # Copy your committed code onto the runner.

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: demo/pom.xml
        # Install Java and cache downloaded Maven dependencies.

      - name: Test and package
        run: mvn --batch-mode -f demo/pom.xml clean verify
        # Compile the application, run tests, and create the JAR.
        # Stop the job if this command fails.

      - name: Build Docker image
        run: docker build -t mvcduplicate:${{ github.sha }} ./demo
        # Build the image only after the Maven step succeeds.
        # Use the commit ID as the image tag.